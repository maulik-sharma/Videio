# Production (VPS). Deployed as a Portainer stack (web editor): paste this file,
# set the variables from .env.example in the stack's environment, and enable the
# stack webhook. CI triggers the webhook with ?IMAGE_TAG=sha-xxxxxxx.
#
# Nginx Proxy Manager reaches the edge at http://<vps-ip>:${EDGE_PORT}.

name: videio

x-api-env: &api-env
  VIDEIO_ENV: prod
  VIDEIO_DB_NAME: ${POSTGRES_DB:-videio}
  VIDEIO_DB_USER: ${POSTGRES_USER:-videio}
  VIDEIO_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  VIDEIO_REDIS_URL: redis://redis:6379/0
  VIDEIO_RABBITMQ_URL: amqp://${RABBITMQ_USER:-videio}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/
  VIDEIO_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  VIDEIO_S3_INTERNAL_ENDPOINT_URL: http://seaweedfs:8333
  # Browsers upload through the edge (/uploads/), so URLs are signed for the app origin.
  VIDEIO_S3_PUBLIC_ENDPOINT_URL: ${APP_ORIGIN:?set APP_ORIGIN}
  VIDEIO_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  VIDEIO_S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  VIDEIO_APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}

services:
  edge:
    image: ghcr.io/maulik-sharma/videio-web:${IMAGE_TAG:-latest}
    init: true
    ports:
      - "${EDGE_BIND:-0.0.0.0}:${EDGE_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [public, internal]
    restart: unless-stopped

  api:
    image: ghcr.io/maulik-sharma/videio-api:${IMAGE_TAG:-latest}
    init: true
    environment:
      <<: *api-env
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      core-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  worker:
    image: ghcr.io/maulik-sharma/videio-worker:${IMAGE_TAG:-latest}
    init: true
    environment:
      <<: *api-env
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      core-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 310s
    networks: [internal]
    restart: unless-stopped

  scheduler:
    image: ghcr.io/maulik-sharma/videio-api:${IMAGE_TAG:-latest}
    init: true
    command: ["taskiq", "scheduler", "app.worker.scheduler:scheduler", "--skip-first-run"]
    environment:
      <<: *api-env
    deploy:
      replicas: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      core-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  # Creates the two S3 buckets and applies browser CORS before the API starts.
  storage-init:
    image: ghcr.io/maulik-sharma/videio-api:${IMAGE_TAG:-latest}
    init: true
    command: ["python", "-m", "app.storage_init"]
    environment:
      <<: *api-env
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  # One-shot: alembic upgrade head against the primary, then exit.
  migrate:
    image: ghcr.io/maulik-sharma/videio-api:${IMAGE_TAG:-latest}
    init: true
    command: ["python", "-m", "app.db.migrate"]
    environment:
      <<: *api-env
    depends_on:
      core-primary:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  core-primary:
    image: postgres:17
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videio}
      POSTGRES_USER: ${POSTGRES_USER:-videio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD}
    configs:
      - source: primary-replication-init
        target: /docker-entrypoint-initdb.d/10-replication.sh
    volumes:
      - core-primary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  core-replica:
    image: postgres:17
    entrypoint: ["bash", "/usr/local/bin/replica-entrypoint.sh"]
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - hot_standby=on
      - -c
      - cluster_name=core-replica
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videio}
      POSTGRES_DB: ${POSTGRES_DB:-videio}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD}
    configs:
      - source: replica-entrypoint
        target: /usr/local/bin/replica-entrypoint.sh
    volumes:
      - core-replica-data:/var/lib/postgresql/data
    depends_on:
      core-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  # Browsers reach the `uploads` bucket through the edge, not this port. It is
  # published on loopback only, for debugging from the VPS.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    command:
      # The image's entrypoint adds -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024.
      - server
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      # Buckets are created deliberately (Phase 2), never by a stray upload.
      - -s3.autoCreateBucket=false
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    ports:
      - "${S3_BIND:-127.0.0.1}:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [public, internal]
    restart: unless-stopped

  # Management UI on ${RABBITMQ_UI_BIND}:${RABBITMQ_UI_PORT}; loopback by default.
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-videio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_UI_BIND:-127.0.0.1}:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [public, internal]
    restart: unless-stopped

# Must stay identical to the `configs` block in compose.yaml (CI checks this).
configs:
  # Runs once, when the primary's data directory is first initialised.
  primary-replication-init:
    content: |
      # Sourced by the postgres image's entrypoint during first-time init.
      psql -v ON_ERROR_STOP=1 \
        -v replication_password="$$REPLICATION_PASSWORD" \
        --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<'EOSQL'
      CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD :'replication_password';
      SELECT pg_create_physical_replication_slot('core_replica');
      EOSQL
      echo "host replication replicator all scram-sha-256" >> "$$PGDATA/pg_hba.conf"

  # On first start (empty data dir), clone the primary; then run as a hot standby.
  replica-entrypoint:
    content: |
      #!/bin/bash
      set -euo pipefail
      if [ ! -s "$$PGDATA/PG_VERSION" ]; then
        echo "core-replica: no data yet, cloning core-primary with pg_basebackup"
        mkdir -p "$$PGDATA"
        rm -rf "$${PGDATA:?}"/*
        chown postgres:postgres "$$PGDATA"
        chmod 700 "$$PGDATA"
        # -R writes standby.signal + primary_conninfo, so Postgres starts as a standby.
        gosu postgres env PGPASSWORD="$$REPLICATION_PASSWORD" \
          pg_basebackup -h core-primary -U replicator -D "$$PGDATA" \
            -R -X stream -S core_replica
      fi
      exec docker-entrypoint.sh "$$@"

  # S3 identities. The one `videio` identity is what the API and workers sign with.
  seaweedfs-s3:
    content: |
      {
        "identities": [
          {
            "name": "videio",
            "credentials": [
              {"accessKey": "${S3_ACCESS_KEY:?set S3_ACCESS_KEY}", "secretKey": "${S3_SECRET_KEY:?set S3_SECRET_KEY}"}
            ],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          },
          {
            "name": "anonymous",
            "actions": ["Read:media"]
          }
        ]
      }

networks:
  public: {}
  internal:
    internal: true

volumes:
  core-primary-data: {}
  core-replica-data: {}
  redis-data: {}
  seaweedfs-data: {}
  rabbitmq-data: {}
