name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy app

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit

  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend
          enable-cache: true

      - name: Prepare .env
        run: cp .env.example .env

      # The replication scripts are inlined in both compose files (Portainer has
      # no repo files to mount), so make sure the two copies never drift apart.
      - name: Check compose.yaml and compose.prod.yaml share the same configs
        run: |
          diff \
            <(docker compose -f compose.yaml config --format json | jq -S .configs) \
            <(docker compose -f compose.prod.yaml config --format json | jq -S .configs)

      # Full stack: primary + replica, Redis, the migrate job, API and edge.
      - name: Start the stack
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --build --wait

      - name: Run integration tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest tests/integration

      - name: Edge serves the API and readiness
        run: curl --fail --silent --show-error http://localhost:8080/readyz

      - name: End-to-end upload, transcode and DLQ smoke test
        working-directory: backend
        run: uv run pytest tests/e2e/test_smoke.py

      - name: Stack logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --no-color

  build-images:
    needs: [backend-lint, unit-tests, web-lint, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: videio-api
            context: backend
            file: backend/Dockerfile
            target: api
          - image: videio-worker
            context: backend
            file: backend/Dockerfile
            target: worker
          - image: videio-web
            context: .
            file: web/Dockerfile
            target: edge
    env:
      # Push only from main; every other ref just proves the images build.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute version tag
        id: version
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # QEMU lets the amd64 runner build the arm64 variant (the VPS is arm64).
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ env.PUSH == 'true' }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.tag }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
