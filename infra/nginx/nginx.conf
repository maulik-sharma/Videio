# Edge nginx: serves the SPA and routes API traffic. Runs as the unprivileged
# `nginx` user, so it listens on 8080 and keeps pid/temp files under /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 10m;

    # Nginx Proxy Manager terminates TLS in front of us. Trust X-Forwarded-For
    # only from private ranges (NPM's container / the Docker bridge) so the
    # client's real IP is used for logging and, later, per-IP rate limits.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Keep the scheme NPM saw (https) instead of our own plain-http hop.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Docker's embedded DNS. `resolve` re-resolves `api` as replicas come and
    # go, so scaling or restarting the API never leaves nginx with stale IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_cache_path /tmp/hls_cache levels=1:2 keys_zone=hls_cache:16m
                     max_size=1g inactive=7d use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=api_limit:10 rate=10r/s;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
    }

    upstream seaweedfs {
        zone seaweedfs 64k;
        server seaweedfs:8333 resolve;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, don't append: $remote_addr is already the real client (resolved
        # by real_ip above), and uvicorn trusts the leftmost entry, which a client
        # could otherwise forge to dodge per-IP rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        location /api/ {
            limit_req zone=api_limit;
            proxy_pass http://api;
        }

        # Browser multipart uploads: presigned PUTs to the `uploads` bucket go
        # straight to SeaweedFS (path-style, so the bucket is the first path
        # segment). Same origin as the app, so no extra DNS name, certificate
        # or CORS. The API signs these URLs for APP_ORIGIN and SigV4 covers the
        # Host header, so forward the exact Host the browser sent ($http_host
        # keeps a non-default port, which $host drops).
        location /uploads/ {
            limit_except PUT {
                deny all;
            }
            # One 10 MiB part per request, plus headroom.
            client_max_body_size 16m;
            proxy_request_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            # Session cookies are for the API, not for storage.
            proxy_set_header Cookie "";
            proxy_pass http://seaweedfs;
        }

        # Generated HLS objects are immutable. Phase 4 adds auth_request and
        # bypasses this cache for private videos.
        location /media/ {
            auth_request /internal/authz;
            proxy_cache hls_cache;
            proxy_cache_lock on;
            proxy_cache_valid 200 7d;
            add_header X-Edge-Cache $upstream_cache_status always;
            add_header X-Cache $upstream_cache_status always;
            proxy_set_header Host seaweedfs:8333;
            proxy_pass http://seaweedfs/media/videos/;
        }

        location = /internal/authz {
            proxy_pass http://api/internal/authz;
            proxy_set_header Cookie "$http_cookie";
        }

        location = /healthz {
            proxy_pass http://api;
        }

        location = /readyz {
            proxy_pass http://api;
        }

        # Vite emits content-hashed filenames, so these never change.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback: client-side routes resolve to index.html.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
