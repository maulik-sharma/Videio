# Edge nginx: serves the SPA and routes API traffic. Runs as the unprivileged
# `nginx` user, so it listens on 8080 and keeps pid/temp files under /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 10m;

    # Nginx Proxy Manager terminates TLS in front of us. Trust X-Forwarded-For
    # only from private ranges (NPM's container / the Docker bridge) so the
    # client's real IP is used for logging and, later, per-IP rate limits.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Keep the scheme NPM saw (https) instead of our own plain-http hop.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Docker's embedded DNS. `resolve` re-resolves `api` as replicas come and
    # go, so scaling or restarting the API never leaves nginx with stale IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_cache_path /tmp/hls_cache levels=1:2 keys_zone=hls_cache:16m
                     max_size=1g inactive=7d use_temp_path=off;

    # Per-IP request limits ($binary_remote_addr is the real client after
    # real_ip above). The API also limits login and upload per account in Redis;
    # this layer stops floods before they reach Python at all. Bursts absorb a
    # page load's handful of parallel requests.
    limit_req_zone $binary_remote_addr zone=per_ip_api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=per_ip_auth:10m rate=2r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # /media/{publicId}/... -> publicId, for the auth_request check.
    map $request_uri $media_video_id {
        "~^/media/([A-Za-z0-9]{11})/"  $1;
        default                      "";
    }

    # The authz answer says whether the edge may keep a copy. Anything but an
    # explicit "1" (public or unlisted) is private: not stored, not served from cache.
    map $media_cacheable $media_private {
        "1"     0;
        default 1;
    }

    upstream api {
        zone api 64k;
        server api:8000 resolve;
    }

    upstream seaweedfs {
        zone seaweedfs 64k;
        server seaweedfs:8333 resolve;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, don't append: $remote_addr is already the real client (resolved
        # by real_ip above), and uvicorn trusts the leftmost entry, which a client
        # could otherwise forge to dodge per-IP rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        location /api/ {
            limit_req zone=per_ip_api burst=50 nodelay;
            proxy_pass http://api;
        }

        location /api/auth/ {
            limit_req zone=per_ip_auth burst=10 nodelay;
            proxy_pass http://api;
        }

        # nginx's own 429s (limit_req) in the API's error shape, with Retry-After.
        # The API's 429s pass through untouched (proxy_intercept_errors is off).
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Try again in a moment.","retry_after":1}}';
        }

        # Browser multipart uploads: presigned PUTs to the `uploads` bucket go
        # straight to SeaweedFS (path-style, so the bucket is the first path
        # segment). Same origin as the app, so no extra DNS name, certificate
        # or CORS. The API signs these URLs for APP_ORIGIN and SigV4 covers the
        # Host header, so forward the exact Host the browser sent ($http_host
        # keeps a non-default port, which $host drops).
        location /uploads/ {
            limit_except PUT {
                deny all;
            }
            # One 10 MiB part per request, plus headroom.
            client_max_body_size 16m;
            proxy_request_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            # Session cookies are for the API, not for storage.
            proxy_set_header Cookie "";
            proxy_pass http://seaweedfs;
        }

        # HLS playlists, segments and thumbnails. Every request, cached or not,
        # first asks the API whether this viewer may see this video (the session
        # cookie rides along), so making a video private or taking it down
        # takes effect at once, even for copies already in the edge cache.
        location /media/ {
            auth_request /internal/authz;
            auth_request_set $media_cacheable $upstream_http_x_media_cacheable;

            # Generated objects are immutable: public and unlisted ones are kept
            # for 7 days. Private ones bypass the cache in both directions.
            proxy_cache hls_cache;
            proxy_cache_lock on;
            proxy_cache_valid 200 7d;
            proxy_cache_bypass $media_private;
            proxy_no_cache $media_private;
            add_header X-Edge-Cache $upstream_cache_status always;

            # Storage says "public"; browsers may keep a copy, but shared caches
            # (a CDN in front of NPM) must not, or they would skip the check above.
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, max-age=86400";

            proxy_set_header Host seaweedfs:8333;
            # Session cookies are for the API, not for storage.
            proxy_set_header Cookie "";
            proxy_pass http://seaweedfs/media/videos/;
        }

        location = /internal/authz {
            internal;
            proxy_pass http://api/internal/authz?video=$media_video_id;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location = /healthz {
            proxy_pass http://api;
        }

        location = /readyz {
            proxy_pass http://api;
        }

        # Vite emits content-hashed filenames, so these never change.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback: client-side routes resolve to index.html.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
